# Render Blueprint: one web service serving the API, dashboard (/dashboard) and landing page (/).
services:
  - type: web
    name: reverra
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python data/generate_data.py && python model/train_model.py
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ADMIN_TOKEN              # random, generated by Render; read it in the service's Environment tab
        generateValue: true
      - key: CORS_ORIGINS
        value: none
      - key: GEMINI_API_KEY           # paste your key in the Render dashboard (leave blank for template emails)
        sync: false
      - key: LLM_RATE_PER_MIN
        value: "8"
      - key: LLM_DAILY_CAP
        value: "300"
